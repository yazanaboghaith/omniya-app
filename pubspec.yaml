  name: omniya
  description: "A new Flutter project."
  publish_to: 'none'

  version: 1.0.0+1

  environment:
    sdk: ">=3.0.0 <4.0.0"

  dependencies:
    flutter:
      sdk: flutter

    flutter_localizations:
        sdk: flutter

    cupertino_icons: ^1.0.8
    flutter_svg: ^2.3.0
    flutter_launcher_icons: ^0.14.4
    page_transition: ^2.2.1
    liquid_glass_bar: ^0.1.1
    syncfusion_flutter_gauges: ^33.2.6
    provider: ^6.1.5+1
    shared_preferences: ^2.5.5
    flutter_secure_storage: ^10.2.0
    local_auth: ^2.1.0
    http: ^1.6.0
    firebase_core: ^4.9.0
    firebase_messaging: ^16.2.2
    flutter_local_notifications: ^17.2.2
    device_info_plus: ^13.1.0
    firebase_crashlytics: ^5.2.2
    firebase_analytics: ^12.4.1
    firebase_remote_config: ^6.5.1
    package_info_plus: ^10.1.0
    flutter_udid: ^4.1.2
    animate_do: ^5.1.0
    url_launcher: ^6.3.2
    liquid_glass_renderer: ^0.2.0-dev.4
    intl: 


  dev_dependencies:
    flutter_test:
      sdk: flutter
      
    flutter_lints: ^6.0.0

  flutter:
    generate: true
    uses-material-design: true
    shaders:
      - packages/liquid_glass_renderer/assets/shaders/liquid_glass_final_render.frag
      - packages/liquid_glass_renderer/assets/shaders/liquid_glass_geometry_blended.frag
    assets:
      - assets/images/
      - assets/fonts/

    fonts:
      - family: Cairo
        fonts:
          - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          - asset: assets/fonts/Cairo/Cairo-Medium.ttf
          - asset: assets/fonts/Cairo/Cairo-Regular.ttf


  # =========================
  #  FLUTTER LAUNCHER ICONS
  flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/images/iconomniya.png"
    
    # (اختياري) لدعم أيقونات أندرويد الحديثة التي تتكيف مع النظام (Adaptive Icons)
    adaptive_icon_background: "assets/images/iconomniya.png" 
    adaptive_icon_foreground: "assets/images/iconomniya.png"
    # adaptive_icon_foreground_inset: 10